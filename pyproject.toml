[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-excel"
version = "0.3.2"
description = "SQLAlchemy dialect for Excel files — use Excel as a database"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Yeongseon Choe"},
]
keywords = ["sqlalchemy", "excel", "dialect", "database", "openpyxl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Typing :: Typed",
]

dependencies = [
    "sqlalchemy>=2.0",
    "excel-dbapi>=0.2.0",
]

[project.optional-dependencies]
graph = ["excel-dbapi[graph]>=0.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.entry-points."sqlalchemy.dialects"]
excel = "sqlalchemy_excel.dialect:ExcelDialect"
"excel.graph" = "sqlalchemy_excel.dialect:ExcelGraphDialect"

[project.urls]
Homepage = "https://github.com/yeongseon/sqlalchemy-excel"
Repository = "https://github.com/yeongseon/sqlalchemy-excel"
Issues = "https://github.com/yeongseon/sqlalchemy-excel/issues"
Changelog = "https://github.com/yeongseon/sqlalchemy-excel/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_excel"]

[tool.ruff]
target-version = "py310"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/sqlalchemy_excel/types.py" = ["N802"]  # SQLAlchemy visit_TYPE convention
"src/sqlalchemy_excel/compiler.py" = ["RUF005"]  # Match SQLAlchemy's tuple concat pattern

[tool.ruff.lint.isort]
known-first-party = ["sqlalchemy_excel"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disable_error_code = ["redundant-cast"]

[[tool.mypy.overrides]]
module = "excel_dbapi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["sqlalchemy_excel"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "@overload",
]
