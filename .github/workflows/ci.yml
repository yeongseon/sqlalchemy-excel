name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        excel-dbapi-version: ["0.4.1", "latest", "main"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          if [ "${{ matrix.excel-dbapi-version }}" = "0.4.1" ]; then
            pip install excel-dbapi==0.4.1
          elif [ "${{ matrix.excel-dbapi-version }}" = "main" ]; then
            pip install git+https://github.com/yeongseon/excel-dbapi.git@main
          else
            pip install excel-dbapi
          fi
          pip install -e ".[dev,graph]"

      - name: Check version/doc sync
        run: |
          python scripts/check_version_sync.py

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: |
          mypy --strict src/

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=sqlalchemy_excel --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
